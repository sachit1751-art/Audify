# Project: AUDIFY
name: Bug report
description: Report a reproducible problem in Audify
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please do not include passwords, account details, private listening history, access tokens, or unredacted logs. Report one issue per submission.
  - type: input
    id: app-version
    attributes:
      label: Audify version
      description: Include the release version and whether it is stable or a prerelease.
      placeholder: 1.8.6 stable
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device model
      placeholder: Pixel 8a
    validations:
      required: true
  - type: input
    id: android-version
    attributes:
      label: Android version
      placeholder: Android 16
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Install, update or onboarding
        - Search or discovery
        - Library or playlists
        - Local music
        - Playback or queue
        - Lyrics
        - Downloads or offline playback
        - Settings or audio controls
        - Android TV
        - Wear OS
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the shortest reliable sequence that triggers the problem.
      placeholder: |
        1. Open Audify
        2. Open ...
        3. Tap ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      placeholder: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      placeholder: What happened instead?
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: Reproducibility
      options:
        - Every time
        - Sometimes
        - Happened once
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Supporting evidence (optional)
      description: Attach screenshots or short recordings after checking that they contain no private information. Redact personal data from logs.
    validations:
      required: false
