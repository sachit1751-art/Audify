name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LISTEN_TOGETHER_SERVER: https://audify-listen-together.sachit1751.workers.dev
        run: |
          printf 'LASTFM_API_KEY=%s\n' "$LASTFM_API_KEY" > local.properties
          printf 'LASTFM_SECRET=%s\n' "$LASTFM_SECRET" >> local.properties
          printf 'LISTEN_TOGETHER_SERVER=%s\n' "$LISTEN_TOGETHER_SERVER" >> local.properties

      # Fork PRs receive no secrets; Android Gradle Plugin generates a temporary
      # debug key for them. Trusted builds can use the stable local debug key.
      - name: Write the debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "No shared debug keystore configured; using the runner's generated debug key."
            exit 0
          fi
          mkdir -p ~/.android
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore
          test -s ~/.android/debug.keystore

      - run: chmod +x gradlew

      - name: Android and shared tests
        run: ./gradlew --no-daemon --max-workers=2 :app:testDevDebugUnitTest :shared:jvmTest :sharedUi:jvmTest

      - name: Android lint
        run: ./gradlew --no-daemon --max-workers=2 :app:lintDevDebug

      - name: Build phone, TV and Wear OS dev variants
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleDevDebug :tv:assembleDevDebug :wearos:assembleDevDebug

      - name: Upload the dev APK
        uses: actions/upload-artifact@v4
        with:
          name: audify-dev-debug
          path: app/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload TV dev APKs
        uses: actions/upload-artifact@v4
        with:
          name: audify-tv-dev-debug
          path: tv/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Wear OS dev APKs
        uses: actions/upload-artifact@v4
        with:
          name: audify-wear-dev-debug
          path: wearos/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Android diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-diagnostics
          path: |
            app/build/reports/
            app/build/intermediates/lint_intermediate_text_report/
            app/build/test-results/
            shared/build/reports/
            sharedUi/build/reports/
          if-no-files-found: warn
          retention-days: 7

  backend:
    name: Backend · Go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
