name: Check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER }}
        run: |
          printf 'LASTFM_API_KEY=%s\n' "$LASTFM_API_KEY" > local.properties
          printf 'LASTFM_SECRET=%s\n' "$LASTFM_SECRET" >> local.properties
          printf 'LISTEN_TOGETHER_SERVER=%s\n' "$LISTEN_TOGETHER_SERVER" >> local.properties

      # The local debug key, so this APK installs over a local dev build and
      # back. Fork PRs get no secrets; AGP then makes a throwaway key itself.
      - name: Write the debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          [ -n "$DEBUG_KEYSTORE_BASE64" ] || exit 0
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - run: chmod +x gradlew

      - name: Android and shared tests
        run: ./gradlew :app:testDevDebugUnitTest :shared:jvmTest :sharedUi:jvmTest

      - name: Android lint
        run: ./gradlew :app:lintDevDebug

      - name: Build phone, TV and Wear OS dev variants
        run: ./gradlew :app:assembleDevDebug :tv:assembleDevDebug :wearos:assembleDevDebug

      - name: Upload the dev APK
        uses: actions/upload-artifact@v4
        with:
          name: audify-dev-debug
          path: app/build/outputs/apk/dev/debug/*.apk

      - name: Upload TV dev APKs
        uses: actions/upload-artifact@v4
        with:
          name: audify-tv-dev-debug
          path: tv/build/outputs/apk/dev/debug/*.apk

      - name: Upload Wear OS dev APKs
        uses: actions/upload-artifact@v4
        with:
          name: audify-wear-dev-debug
          path: wearos/build/outputs/apk/dev/debug/*.apk

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: app/build/reports/tests/

  backend:
    name: Backend · Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
