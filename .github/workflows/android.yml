name: Android Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-prod-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Secrets (Keystore & local.properties)
      env:
        LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER }}
        KEYSTORE: ${{ secrets.KEYSTORE }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        printf 'LASTFM_API_KEY=%s\n' "$LASTFM_API_KEY" > local.properties
        printf 'LASTFM_SECRET=%s\n' "$LASTFM_SECRET" >> local.properties
        printf 'LISTEN_TOGETHER_SERVER=%s\n' "$LISTEN_TOGETHER_SERVER" >> local.properties

        # `KEYSTORE` is the base64 of the release keystore (the same secret the
        # old release workflow fed to its signing step).
        printf '%s' "$KEYSTORE" | base64 -d > audify-release.jks
        {
          printf 'storeFile=audify-release.jks\n'
          printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
          printf 'keyAlias=%s\n' "$KEY_ALIAS"
          printf 'keyPassword=%s\n' "$KEY_PASSWORD"
        } > keystore.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run release gates
      run: ./gradlew :app:testDevDebugUnitTest :shared:jvmTest :sharedUi:jvmTest :app:lintDevDebug

    - name: Build signed phone, TV and Wear OS release APKs
      run: ./gradlew :app:assembleProdRelease :tv:assembleProdRelease :wearos:assembleProdRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: audify-prod-release-signed
        path: app/build/outputs/apk/prod/release/*.apk

    # Built by the same assembleProdRelease, with the same key. The watch app
    # only pairs with a phone app signed by the same key, so a prod watch APK
    # for these phone builds can only come from here, never a local build.
    - name: Upload Wear OS APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: audify-wear-prod-release-signed
        path: wearos/build/outputs/apk/prod/release/*.apk

    - name: Upload Android TV APK Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: audify-tv-prod-release-signed
        path: tv/build/outputs/apk/prod/release/*.apk
