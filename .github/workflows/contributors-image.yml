name: Contributors Image

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: write

concurrency:
  group: contributors-image
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Draw contributor grid
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/contributors_svg.py docs/contributors.svg

      - name: Commit updated contributor image to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- docs/contributors.svg; then
            git add docs/contributors.svg
            git commit -m "chore: update contributors image [skip ci]"
            git push origin HEAD:main
          fi