<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audify — Black proof</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:390px;height:844px;overflow:hidden;background:#050506;color:#f1f0ed;font-family:Arial,sans-serif}body{padding:28px 25px 22px}.top{display:flex;align-items:center;justify-content:space-between}.brand{font-size:13px;font-weight:800;letter-spacing:3px}.brand b{display:inline-block;width:25px;height:25px;border:1px solid #d4d2cf;border-radius:50%;text-align:center;line-height:24px;margin-right:9px}.skip{font-size:12px;color:#929196}.progress{height:1px;background:#28282b;margin-top:27px}.progress:after{content:"";display:block;width:25%;height:1px;background:#efeeea}.hero{margin-top:67px}.hero h1{font-size:46px;line-height:.99;letter-spacing:-3px;font-weight:800;margin:0}.hero h1 span{color:#89898d}.sub{font-size:14px;line-height:1.55;color:#a8a8ac;margin-top:20px;max-width:300px}.trace{height:76px;margin-top:32px;display:flex;align-items:center;gap:4px;border-top:1px solid #29292c;border-bottom:1px solid #29292c;padding:0 3px}.trace i{display:block;flex:1;background:#a9a9ad;height:var(--h);opacity:var(--o);border-radius:1px}.trace i:nth-child(7n){background:#f1f0ed}.labels{margin-top:34px}.label{display:flex;align-items:baseline;justify-content:space-between;padding:13px 0;border-bottom:1px solid #28282b}.label b{font-size:13px;letter-spacing:1.1px}.label span{font-size:11px;color:#929196}.label:first-child b{color:#fff}.bottom{position:absolute;left:25px;right:25px;bottom:25px}.button{height:56px;border-radius:14px;background:#f1f0ed;color:#050506;display:grid;place-items:center;font-size:15px;font-weight:700}.foot{margin-top:12px;text-align:center;color:#77777b;font-size:10px}
</style>
<body>
  <header class="top"><div class="brand"><b>A</b>AUDIFY</div><div class="skip">SKIP</div></header>
  <div class="progress"></div>
  <main>
    <section class="hero"><h1>Music,<br><span>revealed.</span></h1><p class="sub">Discover something new. Play what is already yours. Share the moment.</p></section>
    <div class="trace" aria-hidden="true"><i style="--h:10px;--o:.45"></i><i style="--h:24px;--o:.6"></i><i style="--h:42px;--o:.8"></i><i style="--h:29px;--o:.65"></i><i style="--h:54px;--o:1"></i><i style="--h:35px;--o:.8"></i><i style="--h:64px;--o:1"></i><i style="--h:42px;--o:.85"></i><i style="--h:22px;--o:.6"></i><i style="--h:48px;--o:.9"></i><i style="--h:31px;--o:.7"></i><i style="--h:58px;--o:1"></i><i style="--h:38px;--o:.8"></i><i style="--h:18px;--o:.55"></i><i style="--h:45px;--o:.85"></i><i style="--h:28px;--o:.7"></i><i style="--h:55px;--o:1"></i><i style="--h:34px;--o:.8"></i><i style="--h:15px;--o:.5"></i><i style="--h:39px;--o:.8"></i><i style="--h:25px;--o:.65"></i><i style="--h:52px;--o:1"></i><i style="--h:32px;--o:.8"></i><i style="--h:17px;--o:.5"></i><i style="--h:44px;--o:.85"></i><i style="--h:28px;--o:.7"></i><i style="--h:58px;--o:1"></i><i style="--h:37px;--o:.8"></i><i style="--h:20px;--o:.55"></i><i style="--h:47px;--o:.9"></i></div>
    <section class="labels"><div class="label"><b>DISCOVER</b><span>Music beyond your library</span></div><div class="label"><b>PLAY</b><span>Files already on your device</span></div><div class="label"><b>SHARE</b><span>Listen in sync with friends</span></div></section>
  </main>
  <footer class="bottom"><div class="button">Get started</div><div class="foot">ONE LISTENING SPACE. YOUR CHOICE.</div></footer>
</body>
</html>
