<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audify — Darkroom sequence</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:390px;height:844px;overflow:hidden;background:#100d0a;color:#f1eee8;font-family:Arial,sans-serif}body{padding:27px 25px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:13px;font-weight:800;letter-spacing:2.8px}.brand i{font-style:normal;color:#d69a55;margin-right:9px}.skip{font-size:11px;color:#a99a89}.progress{display:flex;gap:5px;margin-top:26px}.progress i{height:2px;flex:1;background:#49392a}.progress i:first-child{background:#e1ad70}.hero{margin-top:56px}.hero h1{font-size:42px;line-height:1.02;letter-spacing:-2.5px;margin:0}.hero p{font-size:13px;line-height:1.55;color:#b8aa99;margin-top:16px;max-width:300px}.tray{margin-top:38px;border:1px solid #55432f;padding:15px 16px 13px;background:#17120d}.trayhead{display:flex;justify-content:space-between;font-size:10px;letter-spacing:1.4px;color:#d69a55}.strip{display:flex;gap:4px;margin:16px 0 12px;height:44px;align-items:end}.strip i{flex:1;background:#e1ad70;height:var(--h);opacity:var(--o)}.strip i:nth-child(3n){background:#eee7db}.caption{font-size:11px;color:#c0b4a5;line-height:1.4}.stages{margin-top:25px;display:flex;gap:0}.stages span{flex:1;border-top:1px solid #55432f;padding-top:10px;font-size:9px;letter-spacing:.8px;color:#a99a89}.stages span:first-child{border-color:#e1ad70;color:#f1eee8}.bottom{position:absolute;left:25px;right:25px;bottom:25px}.button{height:56px;border-radius:14px;background:#f1eee8;color:#100d0a;display:grid;place-items:center;font-weight:700;font-size:15px}.foot{text-align:center;margin-top:12px;font-size:10px;color:#948574}
</style>
<body><header class="top"><div class="brand"><i>◉</i>AUDIFY</div><div class="skip">SKIP SETUP</div></header><div class="progress"><i></i><i></i><i></i><i></i></div><main><section class="hero"><h1>Let your<br>music develop.</h1><p>Start with what you have. Add an account or a music source only when you need it.</p></section><section class="tray"><div class="trayhead"><b>YOUR LISTENING MIX</b><span>01 / 04</span></div><div class="strip"><i style="--h:12px;--o:.5"></i><i style="--h:24px;--o:.7"></i><i style="--h:37px;--o:.9"></i><i style="--h:20px;--o:.6"></i><i style="--h:44px;--o:1"></i><i style="--h:28px;--o:.75"></i><i style="--h:36px;--o:.9"></i><i style="--h:16px;--o:.6"></i><i style="--h:32px;--o:.8"></i><i style="--h:42px;--o:1"></i><i style="--h:23px;--o:.7"></i><i style="--h:35px;--o:.9"></i></div><div class="caption">Discover music, play local audio, and listen with friends.</div></section><section class="stages"><span>DISCOVER</span><span>NAME</span><span>CONNECT</span><span>LISTEN</span></section></main><footer class="bottom"><div class="button">Get started</div><div class="foot">NO SETUP CHOICE IS PERMANENT</div></footer></body>
</html>
